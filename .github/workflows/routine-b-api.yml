name: Routine B - Human Approved Follow-Up

on:
  repository_dispatch:
    types: [routine-b-approved]

jobs:
  routine-b:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Perform approved follow-up action
        run: |
          set -e

          OUTPUT="project11-two-routine-gate/task1/routine-b/output/follow-up.md"

          mkdir -p "$(dirname "$OUTPUT")"

          cat > "$OUTPUT" <<'EOF'
          # Routine B Follow-Up

          Routine B executed the approved follow-up action.

          Trigger: repository_dispatch
          Event type: routine-b-approved
          Approval: human-approved
          Status: COMPLETED
          EOF

          echo "ROUTINE B ACTION PERFORMED"
          echo "Created/updated: $OUTPUT"

      - name: Verify actual action
        run: |
          set -e

          OUTPUT="project11-two-routine-gate/task1/routine-b/output/follow-up.md"

          test -f "$OUTPUT"

          echo "===== ACTUAL ACTION EVIDENCE ====="
          echo "File exists: $OUTPUT"
          echo "File contents:"
          cat "$OUTPUT"

          grep -q "Status: COMPLETED" "$OUTPUT"

          echo "===== VERIFICATION PASSED ====="
          echo "Routine B actually performed the follow-up action."

      - name: Commit follow-up evidence
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add project11-two-routine-gate/task1/routine-b/output/follow-up.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(project11): record Routine B follow-up"
            git push
          fi

      - name: Record B execution evidence
        run: |
          echo "ROUTINE B EXECUTED"
          echo "Trigger: repository_dispatch"
          echo "Event type: routine-b-approved"
          echo "Human API approval was required."
          echo "Actual follow-up action: VERIFIED"
